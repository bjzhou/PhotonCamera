[project]
name = "photon-lut-training"
version = "0.1.0"
description = "Train an sRGB reference-image to 3D LUT model"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1,<2.3",
    "pillow>=11,<13",
    "torch>=2.6,<3",
    "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
export = ["tensorflow>=2.20,<2.22"]

[project.scripts]
photon-lut = "photon_lut.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photon_lut"]
