name: Android Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Serial cold build baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Amazon Corretto 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          BUILT_IN_API_KEY: ${{ secrets.BUILT_IN_API_KEY }}
          BUILT_IN_API_KEY_GOOGLE: ${{ secrets.BUILT_IN_API_KEY_GOOGLE }}
        run: |
          {
            printf 'BUILT_IN_API_KEY=%s\n' "$BUILT_IN_API_KEY"
            printf 'BUILT_IN_API_KEY_GOOGLE=%s\n' "$BUILT_IN_API_KEY_GOOGLE"
          } > local.properties

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > app/release.keystore

      - name: Build release APKs serially
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDefaultRelease :app:assembleSamsungRelease :app:assembleMeituRelease \
            --no-build-cache --console=plain --profile \
            -Dcom.android.tools.r8.printtimes=true \
            -Pkotlin.build.report.output=file \
            -Pkotlin.build.report.include_compiler_arguments=false

      - name: Save build performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-serial
          path: |
            build/reports/profile/
            build/reports/kotlin-build/
            app/build/reports/kotlin-build/
          retention-days: 7

      - name: Save release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-serial
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
